<svg width="128" height="128" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bg-grad" x1="50" y1="0" x2="50" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c1a3e" />
      <stop offset="100%" stop-color="#071026" />
    </linearGradient>

    <!-- 3D Blue Base Plate Gradient -->
    <linearGradient id="blue-plate" x1="30" y1="25" x2="70" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0070f3" />
      <stop offset="100%" stop-color="#004499" />
    </linearGradient>

    <!-- White Tag Body Gradient -->
    <linearGradient id="tag-grad" x1="45" y1="16" x2="55" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#edf3fc" />
    </linearGradient>

    <!-- Cyan Fold Gradient -->
    <linearGradient id="cyan-fold" x1="52" y1="16" x2="60" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00c4ff" />
      <stop offset="100%" stop-color="#0072f5" />
    </linearGradient>

    <!-- Orange Accent Gradient -->
    <linearGradient id="orange-grad" x1="60" y1="38" x2="70" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Drop shadow for 3D tag pop -->
    <filter id="tag-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="-1" dy="2" stdDeviation="2.5" flood-color="rgba(0,0,0,0.4)" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. Outer Squircle Container -->
  <rect x="0" y="0" width="100" height="100" rx="23" fill="url(#bg-grad)" />

  <!-- 2. Top-Right Cyan Viewfinder / Targeting Bracket -->
  <path d="M 61 17.5 L 68.5 17.5 A 3 3 0 0 1 71.5 20.5 L 71.5 28" stroke="#00e5ff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 3. Layered 3D Electric Blue Offset Base Plate -->
  <!-- 3a. Deep blue under-extrusion facet -->
  <path d="M 30 38 L 30 52.5 A 6 6 0 0 0 34 58 L 46 68 A 7 7 0 0 0 52 70 L 61 70 L 62.5 65.5 L 44 65.5 A 5 5 0 0 1 40 61.5 L 33 46 Z" fill="#003b87" />

  <!-- 3b. Bright blue stepped layer -->
  <path d="M 34.5 28 A 7 7 0 0 0 30 34.5 L 30 51 A 5 5 0 0 0 33 55 L 44 66 A 6 6 0 0 0 49 68 L 63 68 A 5 5 0 0 0 67 65 L 67.5 60 L 64 57 L 60 57 A 4 4 0 0 1 57 55.5 L 42 38 A 4 4 0 0 1 41 33 L 41 28 Z" fill="url(#blue-plate)" />

  <!-- 4. Orange Accent Wedge at Lower Right -->
  <path d="M 60.5 45 L 68.5 37 A 4 4 0 0 1 71 40 L 71 43 A 4 4 0 0 1 69 46.5 L 63 51 A 3 3 0 0 1 60 50 Z" fill="url(#orange-grad)" />
  <path d="M 61 45.5 L 68 38.5" stroke="#ffd166" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />

  <!-- 5. Main White Label (Foreground) -->
  <g filter="url(#tag-shadow)">
    <!-- Main Tag Shape -->
    <path d="M 43 16.5 A 6.5 6.5 0 0 0 36.5 23 L 36.5 43 A 6 6 0 0 0 38.5 47.5 L 45 54 A 5 5 0 0 0 48.5 55.5 L 57 55.5 A 5 5 0 0 0 60.5 54 L 68 46.5 A 5 5 0 0 0 69.5 43 L 69.5 34 A 4 4 0 0 0 68 31 L 59 22 L 52 16.5 Z" fill="url(#tag-grad)" />

    <!-- 6. Tag Eyelet Cutout Hole (Top Left) -->
    <circle cx="43" cy="23.5" r="4.2" fill="#0c1a3e" />
    <circle cx="43" cy="23.5" r="4.2" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />

    <!-- 7. Dog-Ear Folded Corner (Top Right) -->
    <path d="M 52 16.5 L 52 24.5 A 2 2 0 0 0 54 26.5 L 61 24 Z" fill="#0055b3" />
    <path d="M 52 16.5 L 52 24.5 A 1.5 1.5 0 0 0 53.5 26 L 61 24.5 Z" fill="url(#cyan-fold)" />
    <path d="M 52 16.5 L 61 24.5" stroke="#e0f2fe" stroke-width="1.2" stroke-linecap="round" />

    <!-- 8. Precision Barcode Stripes -->
    <g fill="#091430">
      <rect x="41.5" y="30" width="2.8" height="15" rx="0.7" />
      <rect x="45.5" y="30" width="2.0" height="15" rx="0.6" />
      <rect x="48.7" y="30" width="1.4" height="15" rx="0.5" />
      <rect x="51.3" y="30" width="2.0" height="15" rx="0.6" />
      <rect x="54.5" y="30" width="2.8" height="15" rx="0.7" />
      <rect x="58.5" y="30" width="1.4" height="15" rx="0.5" />
    </g>
  </g>
</svg>
